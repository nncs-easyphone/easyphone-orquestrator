name: easyphone

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  traefik:
    image: traefik:v3
    container_name: easyphone-traefik
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_data:/etc/traefik
      - ./traefik/conf:/etc/traefik/conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - "${DNS_SERVER_1:-8.8.8.8}"
      - "${DNS_SERVER_2:-1.1.1.1}"
    networks:
      - default          # FIX 1: adicionado para garantir alcance a api/web mesmo sem label
      - traefik-public
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command:
      - "--ping=true"
      - "--providers.docker=true"
      - "--providers.docker.network=easyphone-traefik-public"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/etc/traefik/conf"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=httpreq"
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=8.8.8.8:53,1.1.1.1:53"
    environment:
      - HTTPREQ_ENDPOINT=http://api:7002/dns-challenge
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: easyphone-pg
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "7001:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: easyphone-pgbouncer
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "7003:6432"
    environment:
      AUTH_TYPE: scram-sha-256
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LISTEN_PORT: "6432"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "30"
      MIN_POOL_SIZE: "20"
      RESERVE_POOL_SIZE: "10"
      MAX_USER_CONNECTIONS: "50"
      SERVER_LOGIN_RETRY: "3"
      QUERY_TIMEOUT: "300"
      CLIENT_IDLE_TIMEOUT: "600"
      PKT_BUF: "8192"
      MAX_PREPARED_STATEMENTS: "100"
      IGNORE_STARTUP_PARAMETERS: "extra_float_digits,application_name"
      STATS_USERS: postgres
    networks:
      - default
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: pg_isready -h localhost -p 6432 -U ${POSTGRES_USER}
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  migrations:
    image: ghcr.io/nncs-easyphone/easyphone-api:main
    build:
      context: ../easyphone-api
      dockerfile: Dockerfile
    container_name: easyphone-migrations
    command: sh -c "npx prisma migrate deploy"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    networks:
      - default
    depends_on:
      postgres:
        condition: service_healthy

  # Extrai o certificado de pbx.${DOMAIN} do acme.json do Traefik para um volume
  # que o Coturn lê (TURNS na 5349). O --watch reescreve os arquivos a cada
  # renovação, sem intervenção manual.
  certs-dumper:
    image: ldez/traefik-certs-dumper:v2.11.4
    container_name: easyphone-certs-dumper
    restart: unless-stopped
    logging: *default-logging
    command:
      - "file"
      - "--version=v3"
      - "--watch"
      - "--source=/traefik/acme.json"
      - "--dest=/certs"
      - "--domain-subdir"
      - "--post-hook=chmod -R a+rX /certs"
    volumes:
      - traefik_data:/traefik:ro
      - coturn_certs:/certs
    depends_on:
      traefik:
        condition: service_healthy

  coturn:
    image: coturn/coturn:latest
    container_name: easyphone-coturn
    restart: unless-stopped
    logging: *default-logging
    network_mode: host
    # Sem `command`: o CMD oficial da imagem já é
    #   ["--log-file=stdout", "--external-ip=$(detect-external-ip)"]
    # e o turnserver lê /etc/coturn/turnserver.conf automaticamente. Sobrescrever
    # o command descartava a autodetecção do IP público.
    # Sem `user`: a imagem roda como nobody:nogroup e o --post-hook do
    # certs-dumper (chmod a+rX) já deixa os certificados legíveis.
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - coturn_certs:/certs:ro
    cap_add:
      - NET_ADMIN
    depends_on:
      - asterisk
      - certs-dumper

  asterisk:
    image: ghcr.io/nncs-easyphone/easyphone-asterisk:main
    build:
      context: ../easyphone-asterisk
      dockerfile: Dockerfile
    container_name: easyphone-asterisk
    restart: unless-stopped
    logging: *default-logging
    network_mode: host
    environment:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "7001"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Vazia (VM com IP público direto na interface): o entrypoint remove o
      # stunaddr do rtp.conf. Um stunaddr sem resposta bloqueia ~3-8s a criação
      # de CADA instância RTP (toda chamada, qualquer ramal). Se precisar de
      # STUN, aponte para o Coturn público (ex.: pbx.dominio.com.br:3478) e
      # confirme que responde antes.
      ASTERISK_STUN_ADDR: ${ASTERISK_STUN_ADDR:-}
      # Interface em que o ARI (8088) escuta. Vazio = o padrão da imagem,
      # 172.17.0.1 (o host na bridge docker0, que é o host.docker.internal por
      # onde api/seed chegam). Só preencha se o Docker usar outro `bip` ou se
      # a API alcançar o ARI de fora do host (0.0.0.0).
      ASTERISK_HTTP_BIND_ADDR: ${ASTERISK_HTTP_BIND_ADDR:-}
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx \"core waitfullybooted\" | grep -q \"fully booted\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - asterisk_config:/etc/asterisk
      - asterisk_lib:/var/lib/asterisk
      - asterisk_log:/var/log/asterisk
      - asterisk_monitor:/var/spool/asterisk/monitor
    cap_add:
      - SYS_NICE
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  seed:
    image: ghcr.io/nncs-easyphone/easyphone-api:main
    build:
      context: ../easyphone-api
      dockerfile: Dockerfile
    container_name: easyphone-seed
    command: sh -c "npx prisma db seed"
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      ASTERISK_PATH_MOH: ${ASTERISK_PATH_MOH}
      ASTERISK_PATH_URA: ${ASTERISK_PATH_URA}
      UPLOAD_MOH_MAX_FILE_SIZE: "${UPLOAD_MOH_MAX_FILE_SIZE}"
      MAX_CAPTURE_GROUPS: "${MAX_CAPTURE_GROUPS}"
      ASTERISK_PATH_CONFIG: ${ASTERISK_PATH_CONFIG}
      ASTERISK_HOST: host.docker.internal
      ASTERISK_ARI_PORT: "8088"
      ASTERISK_AMI_PORT: "5038"
      ASTERISK_AMI_USER: easyphone
      ASTERISK_AMI_PASSWORD: default-secret
      ASTERISK_ARI_APP: easyphone
      PRISMA_LOGS_OFF: "true"
      DATA_SECRET_CRYPTOGRAPHY_KEY: ${DATA_SECRET_CRYPTOGRAPHY_KEY}
      FIREBASE_URL: ${FIREBASE_URL}
      ASTERISK_PATH_MONITOR: ${ASTERISK_PATH_MONITOR}
      ASTERISK_DIALPLAN_ORIGINATE_CONTEXT: ${ASTERISK_DIALPLAN_ORIGINATE_CONTEXT}
      ASTERISK_DIALPLAN_BLOCK_CONTEXT: ${ASTERISK_DIALPLAN_BLOCK_CONTEXT}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT}
      LICENSE_CLIENT_ID: ${LICENSE_CLIENT_ID}
      LICENSE_HARDWARE_ID: ${LICENSE_HARDWARE_ID}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
    volumes:
      - asterisk_config:/etc/asterisk
      - asterisk_lib:/var/lib/asterisk
      - asterisk_log:/var/log/asterisk
      - asterisk_monitor:/var/spool/asterisk/monitor
    depends_on:
      pgbouncer:
        condition: service_started
      asterisk:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  api:
    image: ghcr.io/nncs-easyphone/easyphone-api:main
    build:
      context: ../easyphone-api
      dockerfile: Dockerfile
    container_name: easyphone-api
    restart: unless-stopped
    logging: *default-logging
    ports: []
    networks:
      - default
      - traefik-public
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: UTC
      NODE_ENV: ${NODE_ENV}
      PORT: "7002"
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: https://app.${DOMAIN}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}?pgbouncer=true
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ASTERISK_PATH_MOH: ${ASTERISK_PATH_MOH}
      ASTERISK_PATH_URA: ${ASTERISK_PATH_URA}
      UPLOAD_MOH_MAX_FILE_SIZE: "${UPLOAD_MOH_MAX_FILE_SIZE}"
      MAX_CAPTURE_GROUPS: "${MAX_CAPTURE_GROUPS}"
      ASTERISK_PATH_CONFIG: ${ASTERISK_PATH_CONFIG}
      ASTERISK_HOST: host.docker.internal
      ASTERISK_ARI_PORT: "8088"
      ASTERISK_AMI_PORT: "5038"
      ASTERISK_AMI_USER: easyphone
      ASTERISK_AMI_PASSWORD: default-secret
      ASTERISK_ARI_APP: easyphone
      PRISMA_LOGS_OFF: "true"
      DATA_SECRET_CRYPTOGRAPHY_KEY: ${DATA_SECRET_CRYPTOGRAPHY_KEY}
      FIREBASE_URL: ${FIREBASE_URL}
      ASTERISK_PATH_MONITOR: ${ASTERISK_PATH_MONITOR}
      ASTERISK_DIALPLAN_ORIGINATE_CONTEXT: ${ASTERISK_DIALPLAN_ORIGINATE_CONTEXT}
      ASTERISK_DIALPLAN_BLOCK_CONTEXT: ${ASTERISK_DIALPLAN_BLOCK_CONTEXT}
      FIREBASE_SERVICE_ACCOUNT: '${FIREBASE_SERVICE_ACCOUNT}'
      LICENSE_CLIENT_ID: ${LICENSE_CLIENT_ID}
      LICENSE_HARDWARE_ID: ${LICENSE_HARDWARE_ID}
      CORPORATE_ALLOW_API_KEY: ${CORPORATE_ALLOW_API_KEY}
      CORPORATE_API_KEY: ${CORPORATE_API_KEY}
      IVR_HEALTH_CHECK_API_KEY: ${IVR_HEALTH_CHECK_API_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=easyphone-traefik-public"
      - "traefik.http.routers.api.rule=Host(`api.${DOMAIN}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=7002"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$$PORT/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - asterisk_config:/etc/asterisk
      - asterisk_lib:/var/lib/asterisk
      - asterisk_log:/var/log/asterisk
      - asterisk_monitor:/var/spool/asterisk/monitor
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      migrations:
        condition: service_completed_successfully
      asterisk:
        condition: service_started
      seed:
        condition: service_completed_successfully

  web:
    image: ghcr.io/nncs-easyphone/easyphone-web:main
    build:
      context: ../easyphone-web
      dockerfile: Dockerfile
    container_name: easyphone-web
    restart: unless-stopped
    logging: *default-logging
    ports: []
    networks:
      - default
      - traefik-public
    environment:
      PORT: "3000"
      VITE_API_URL: https://api.${DOMAIN}
      VITE_API_DELAY: "0"
      VITE_ENABLE_API_DELAY: "false"
      VITE_FORMAT_FILES_UPLOAD_MOH: ${UPLOAD_MOH_FORMAT}
      VITE_MAX_FILES_UPLOAD_MOH: "${UPLOAD_MOH_MAX_FILES}"
      VITE_MAX_FILE_SIZE_UPLOAD_MOH: "${UPLOAD_MOH_MAX_FILE_SIZE}"
      VITE_MAX_FILE_SIZE_UPLOAD_IVR_AUDIO: "${UPLOAD_IVR_MAX_FILE_SIZE}"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=easyphone-traefik-public"
      - "traefik.http.routers.web.rule=Host(`app.${DOMAIN}`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.services.web.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$$PORT/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      api:
        condition: service_started

