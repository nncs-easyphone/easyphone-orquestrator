volumes:
  pgdata:
    name: easyphone_pgdata
  coturn_certs:
    name: easyphone_coturn_certs
  asterisk_config:
    name: easyphone_asterisk_config
  asterisk_lib:
    name: easyphone_asterisk_lib
  asterisk_log:
    name: easyphone_asterisk_log
  asterisk_monitor:
    name: easyphone_asterisk_monitor
  traefik_data:
    name: easyphone_traefik_data
  backup_data:
    name: easyphone_backup_data

networks:
  default:
    name: easyphone_default
    driver: bridge
  traefik-public:
    name: easyphone-traefik-public
